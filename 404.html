<!DOCTYPE html>
<html>
<head>
  <title>404 - Page Not Found</title>
</head>
<body>
  <h1>404: You've reached the end of the map!</h1>
  <p>It’s quiet here... maybe some music will help?</p>

  <audio id="myOST">
    <source src="your-music-file.mp3" type="audio/mpeg">
  </audio>

  <button onclick="playMusic()" type="button">OST</button>

  <script>
    function playMusic() {
      var music = document.getElementById("myOST");
      music.play();
    }
  </script>

  <br><br>
  <a href="/">Go Back Home</a>
</body>
</html>
