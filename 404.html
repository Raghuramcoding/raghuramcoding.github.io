<!DOCTYPE html>
<html>
<head>

  <style>
    /* 1. This centers the box on the screen */
    body {

      display: flex;
      justify-content: center;

      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
