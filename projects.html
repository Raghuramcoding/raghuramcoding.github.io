<!DOCTYPE html>
<html>
<head>
  <style>
    /* 1. DARK BACKGROUND FOR THE DECK */
    body {
      margin: 0;
      padding: 0;
      background-color: #0a0a0a;
      display: flex;
      font-family: 'Courier New', Courier, monospace;
    }

    /* 2. THE SIDEBAR CONTAINER */
    #sidebar {
      width: 100px;
      height: 100vh;
      background-color: #000;
      border-right: 2px solid #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 40px;
      gap: 30px;
    }

    /* 3. NEON BUTTON BASE STYLE */
    .btn {
      width: 60px;
      height: 60px;
      background: transparent;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      transition: all 0.3s ease;
      border-radius: 8px;
    }

    /* GREEN NEON (ROOT) */
    .green {
      color: #39ff14;
      border: 2px solid #39ff14;
      box-shadow: 0 0 10px #39ff14;
    }
    .green:hover {
      background: #39ff14;
      color: #000;
      box-shadow: 0 0 30px #39ff14;
    }

    /* BLUE NEON (MAP) */
    .blue {
      color: #00f2ff;
      border: 2px solid #00f2ff;
      box-shadow: 0 0 10px #00f2ff;
    }
    .blue:hover {
      background: #00f2ff;
      color: #000;
      box-shadow: 0 0 30px #00f2ff;
    }

    /* PINK NEON (BRAWL) */
    .pink {
      color: #ff00ff;
      border: 2px solid #ff00ff;
      box-shadow: 0 0 10px #ff00ff;
    }
    .pink:hover {
      background: #ff00ff;
      color: #000;
      box-shadow: 0 0 30px #ff00ff;
    }

    /* 4. MAIN CONTENT AREA */
    #content {
      flex-grow: 1;
      padding: 50px;
      color: white;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="btn green" onclick="changeMode('ROOT')">/R</div>
    <div class="btn blue" onclick="changeMode('MAP')">MAP</div>
    <div class="btn pink" onclick="changeMode('BRAWL')">!!!</div>
  </div>

  <div id="content">
    <h1 id="status">CYBER-DECK READY</h1>
    <p id="details">Select a sector from the sidebar...</p>
  </div>

  <script>
    // 5. THE LOGIC (CHANGING MODES)
    function changeMode(modeName) {
      const statusText = document.getElementById('status');
      const detailText = document.getElementById('details');

      if (modeName === 'ROOT') {
        statusText.innerText = "ACCESSING /ROOT";
        statusText.style.color = "#39ff14";
        detailText.innerText = "Viewing directory files...";
      } else if (modeName === 'MAP') {
        statusText.innerText = "OPENING MAP";
        statusText.style.color = "#00f2ff";
        detailText.innerText = "Locating coordinates...";
      } else if (modeName === 'BRAWL') {
        statusText.innerText = "COMBAT INITIALIZED";
        statusText.style.color = "#ff00ff";
        detailText.innerText = "Warning: Enemies detected!";
      }
    }
  </script>

</body>
</html>
