<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trackmania Stats - System.exe</title>
    <style>
        :root {
            --win-blue: #000080;
            --win-gray: #c0c0c0;
            --cyber-blue: #00ccff;
            --neon-green: #00ff00;
        }

        body {
            background: #001a1a;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .stat-window {
            background: var(--win-gray);
            color: black;
            border: 4px outset #ffffff;
            padding: 2px;
            width: 400px;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.5);
        }

        .title-bar {
            background: linear-gradient(90deg, var(--win-blue), var(--cyber-blue));
            color: white;
            padding: 4px 8px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }

        .content {
            padding: 20px;
            border: 2px inset #ffffff;
            margin: 4px;
            background: #eee;
        }

        .btn {
            background: var(--win-gray);
            border: 2px outset white;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            display: inline-block;
            text-decoration: none;
            color: black;
        }

        .btn:active { border-style: inset; }
        .loading { color: var(--win-blue); font-weight: bold; }
        .error { color: red; }
    </style>
</head>
<body>

    <div class="stat-window">
        <div class="title-bar">
            <span>TRACKMANIA_STATS.LOG</span>
            <span>[?] [X]</span>
        </div>
        <div class="content">
            <div id="status-box">
                <p>Status: <span id="api-status" class="loading">Awaiting Connection...</span></p>
                <div id="stats-display" style="display:none;">
                    <p><strong>Player:</strong> <span id="tm-name">---</span></p>
                    <p><strong>Global Rank:</strong> <span id="tm-rank">---</span></p>
                </div>
                <button id="auth-btn" class="btn" onclick="startLogin()">LOGIN WITH TRACKMANIA</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const CLIENT_ID = 'c1369621665987ffca70'; // Put your identifier here
        const REDIRECT_URI = 'https://raghuramcoding.github.io/trackmaniastats.html';
        
        // 1. Start the Login Flow
        function startLogin() {
            const authUrl = `https://api.trackmania.com/oauth/authorize?response_type=code&client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=read_rank`;
            window.location.href = authUrl;
        }

        // 2. Handle the return from Trackmania
        async function handleCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (code) {
                document.getElementById('api-status').innerText = "Authenticating...";
                document.getElementById('auth-btn').style.display = 'none';

                try {
                    // exchange code for token (Requires a backend or proxy usually)
                    // For now, we will show the status change
                    document.getElementById('api-status').innerText = "Connected!";
                    document.getElementById('stats-display').style.display = 'block';
                    
                    // Example Manual ID Fetch (requires token)
                    // fetch('https://api.trackmania.com/api/user', { headers: { 'Authorization': 'Bearer ' + token }})
                } catch (err) {
                    document.getElementById('api-status').innerHTML = '<span class="error">Auth Error (CORS)</span>';
                }
            }
        }

        window.onload = handleCallback;
    </script>
</body>
</html>
