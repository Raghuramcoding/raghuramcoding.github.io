<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commit Engine — an idle software empire</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap');

  :root {
    --void: #14110D;
    --panel: #1C1812;
    --border: #4A3A1A;
    --border-soft: #29230F;
    --amber: #FFB000;
    --amber-bright: #FFD666;
    --amber-dim: #8F8370;
    --text: #E4D5B7;
    --text-muted: #93816B;
    --text-faint: #4A3A1A;
    --cyan: #6FD3C7;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--void);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }

  .wrap {
    width: 100%;
    max-width: 1100px;
    position: relative;
  }

  /* Free trial popup */
  .free-trial {
    display: none;
    position: absolute;
    width: 170px;
    padding: 12px 14px;
    background: #1C1812;
    border: 2px solid var(--cyan);
    color: var(--cyan);
    text-align: center;
    z-index: 50;
    box-shadow: 0 0 16px rgba(111, 211, 199, 0.35);
    animation: trial-pulse 1.4s ease-in-out infinite;
  }
  .free-trial:hover { background: #24302E; }
  .free-trial-title {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.03em;
    margin-bottom: 4px;
    line-height: 1.3;
  }
  .free-trial-sub {
    font-size: 10px;
    color: var(--text-muted);
  }
  @keyframes trial-pulse {
    0%, 100% { box-shadow: 0 0 10px rgba(111, 211, 199, 0.25); }
    50% { box-shadow: 0 0 22px rgba(111, 211, 199, 0.55); }
  }
  @media (prefers-reduced-motion: reduce) {
    .free-trial { animation: none; }
  }

  button {
    font-family: inherit;
    cursor: pointer;
  }
  button:disabled {
    cursor: not-allowed;
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--panel); }
  ::-webkit-scrollbar-thumb { background: var(--border); }

  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .cursor-blink { animation: blink 1s step-end infinite; }
  @media (prefers-reduced-motion: reduce) {
    .cursor-blink { animation: none; opacity: 1; }
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    margin-bottom: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .term-icon { color: var(--amber); }
  .title {
    font-weight: 800;
    letter-spacing: 0.06em;
    color: var(--amber);
    font-size: 15px;
  }
  .version {
    font-size: 11px;
    color: var(--text-muted);
    display: none;
  }
  @media (min-width: 480px) { .version { display: inline; } }

  .prestige-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.03em;
    background: transparent;
    color: var(--text-faint);
    border: 1px solid #3A3020;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .prestige-btn.ready {
    color: var(--cyan);
    border-color: var(--cyan);
  }
  .prestige-btn.armed {
    background: var(--cyan);
    color: var(--void);
  }

  /* Welcome back banner */
  .welcome-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 16px;
    margin-bottom: 12px;
    background: #24201C;
    border: 1px solid var(--cyan);
    color: var(--cyan);
    font-size: 12px;
  }
  .welcome-banner button {
    background: none;
    border: none;
    color: var(--cyan);
    font-weight: 700;
    flex-shrink: 0;
  }

  /* Stat bar */
  .stat-bar {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1px;
    margin-bottom: 12px;
    background: var(--border);
  }
  @media (min-width: 640px) { .stat-bar { grid-template-columns: repeat(4, 1fr); } }
  .stat-cell {
    background: var(--panel);
    padding: 8px 12px;
  }
  .stat-label {
    font-size: 11px;
    color: var(--text-muted);
  }
  .stat-value {
    font-weight: 700;
    color: var(--amber-bright);
    font-size: 14px;
  }

  /* Main grid */
  .main-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  @media (min-width: 900px) {
    .main-grid { flex-direction: row; }
    .left-col { width: 40%; }
    .right-col { width: 60%; }
  }
  .left-col, .right-col {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Click panel */
  .click-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    background: var(--panel);
    border: 1px solid var(--border);
  }
  .prompt-line {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .big-counter {
    font-weight: 800;
    font-size: clamp(28px, 6vw, 38px);
    color: var(--amber);
    margin-bottom: 4px;
    text-align: center;
  }
  .counter-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 32px;
  }
  .click-btn {
    width: 180px;
    height: 180px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #24201C;
    border: 2px solid var(--amber);
    color: var(--amber);
    font-weight: 700;
    transition: transform 0.08s;
  }
  .click-btn:active { transform: scale(0.96); }
  .click-btn.pulse { transform: scale(0.96); }
  .click-btn-glyph { font-size: 24px; }
  .click-btn-text { font-size: 14px; letter-spacing: 0.03em; }
  .click-btn-power { font-size: 11px; color: var(--text-muted); }

  /* Click upgrade row */
  .upgrade-row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    text-align: left;
    background: var(--panel);
    border: 1px solid var(--amber);
    color: var(--text);
    transition: opacity 0.15s;
  }
  .upgrade-row:disabled {
    border-color: #3A3020;
    opacity: 0.5;
  }
  .upgrade-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .upgrade-icon { color: var(--amber-bright); font-size: 15px; }
  .upgrade-name { font-size: 13px; font-weight: 700; }
  .upgrade-sub { font-size: 11px; color: var(--text-muted); }
  .upgrade-cost { font-size: 13px; font-weight: 700; color: var(--amber-bright); }

  /* Shop */
  .shop-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .shop-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--amber);
  }
  .buy-mult-group { display: flex; gap: 4px; }
  .mult-btn {
    padding: 2px 8px;
    font-size: 11px;
    font-weight: 700;
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .mult-btn.active {
    background: var(--amber);
    color: var(--void);
  }

  .shop-list {
    background: var(--panel);
    border: 1px solid var(--border);
    border-top: none;
    max-height: 420px;
    overflow-y: auto;
  }
  .shop-row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 16px;
    text-align: left;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border-soft);
    color: var(--text);
    transition: opacity 0.15s;
  }
  .shop-row:last-child { border-bottom: none; }
  .shop-row:disabled { opacity: 0.4; }
  .shop-row-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .shop-tag {
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 800;
    color: var(--void);
    background: var(--amber-bright);
    padding: 2px 5px;
    letter-spacing: 0.02em;
  }
  .shop-name-block { min-width: 0; }
  .shop-name {
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .shop-sub { font-size: 11px; color: var(--text-muted); }
  .shop-right { text-align: right; flex-shrink: 0; }
  .shop-cost { font-size: 13px; font-weight: 700; color: var(--amber-bright); }
  .shop-qty { font-size: 11px; color: var(--text-muted); }

  /* Log */
  .log-panel {
    margin-top: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
  }
  .log-header {
    padding: 8px 16px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--amber);
    border-bottom: 1px solid var(--border);
  }
  .log-list {
    padding: 8px 16px;
    height: 130px;
    overflow-y: auto;
    font-size: 11px;
  }
  .log-entry { margin-bottom: 4px; color: #6B5F4E; }
  .log-entry:first-child { color: var(--text); }
  .log-time { color: var(--text-faint); }

  .footer-note {
    text-align: center;
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 12px;
  }
</style>
</head>
<body>

<div class="wrap">
  <button id="free-trial" class="free-trial" type="button">
    <div class="free-trial-title" id="free-trial-title">FREE TRIAL</div>
    <div class="free-trial-sub" id="free-trial-sub">claim now — instant 10x LOC</div>
  </button>

  <div class="header">
    <div class="header-left">
      <span class="term-icon">&gt;_</span>
      <span class="title">COMMIT_ENGINE</span>
      <span class="version" id="version-label">v0.0-alpha</span>
    </div>
    <button id="prestige-btn" class="prestige-btn" title="Keep writing code to unlock a ship-worthy release">
      <span>⟳</span>
      <span id="prestige-label">ship v1.0</span>
      <span id="prestige-gain-label"></span>
    </button>
  </div>

  <div id="welcome-banner" class="welcome-banner" style="display:none;">
    <span id="welcome-text"></span>
    <button id="welcome-close">[x]</button>
  </div>

  <div class="stat-bar">
    <div class="stat-cell"><div class="stat-label">LOC</div><div class="stat-value" id="stat-loc">0</div></div>
    <div class="stat-cell"><div class="stat-label">LOC/sec</div><div class="stat-value" id="stat-locps">0</div></div>
    <div class="stat-cell"><div class="stat-label">velocity</div><div class="stat-value" id="stat-velocity">+0%</div></div>
    <div class="stat-cell"><div class="stat-label">refactor points</div><div class="stat-value" id="stat-rp">0</div></div>
  </div>

  <div class="main-grid">
    <div class="left-col">
      <div class="click-panel">
        <div class="prompt-line">$ cat loc_counter.txt</div>
        <div class="big-counter"><span id="big-loc">0</span><span class="cursor-blink">_</span></div>
        <div class="counter-label">lines of code</div>
        <button id="click-btn" class="click-btn">
          <span class="click-btn-glyph">&gt;_</span>
          <span class="click-btn-text">git commit</span>
          <span class="click-btn-power" id="click-power-label">+1 LOC</span>
        </button>
      </div>

      <button id="click-upgrade-btn" class="upgrade-row">
        <div class="upgrade-left">
          <span class="upgrade-icon">⚡</span>
          <div>
            <div class="upgrade-name" id="click-upgrade-name">Better Keyboard</div>
            <div class="upgrade-sub">doubles write speed per commit</div>
          </div>
        </div>
        <div class="upgrade-cost" id="click-upgrade-cost">50</div>
      </button>
    </div>

    <div class="right-col">
      <div class="shop-header">
        <span class="shop-title">── npm install team ──</span>
        <div class="buy-mult-group" id="buy-mult-group">
          <button class="mult-btn active" data-mult="1">x1</button>
          <button class="mult-btn" data-mult="10">x10</button>
          <button class="mult-btn" data-mult="max">max</button>
        </div>
      </div>
      <div class="shop-list" id="shop-list"></div>
    </div>
  </div>

  <div class="log-panel">
    <div class="log-header">── build.log ──</div>
    <div class="log-list" id="log-list"></div>
  </div>

  <div class="footer-note">progress saves automatically in this browser · close the tab any time</div>
</div>

<script>
(function () {
  'use strict';

  // ---------- Config ----------

  var GROWTH = 1.15;

  var GENERATORS = [
    { id: 'stackoverflow', tag: 'SO', name: 'Stack Overflow Tab', baseCost: 15,          baseRate: 0.1 },
    { id: 'intern',        tag: 'IN', name: 'Intern',              baseCost: 100,         baseRate: 1 },
    { id: 'junior',        tag: 'JD', name: 'Junior Dev',           baseCost: 1100,        baseRate: 8 },
    { id: 'senior',        tag: 'SD', name: 'Senior Dev',           baseCost: 12000,       baseRate: 47 },
    { id: 'copilot',       tag: 'AI', name: 'AI Pair Programmer',   baseCost: 130000,      baseRate: 260 },
    { id: 'contractors',   tag: 'CS', name: 'Contractor Squad',     baseCost: 1400000,     baseRate: 1400 },
    { id: 'offshore',      tag: 'OD', name: 'Offshore Dev Team',    baseCost: 20000000,    baseRate: 7800 },
    { id: 'cicd',          tag: 'CI', name: 'CI/CD Pipeline Farm',  baseCost: 330000000,   baseRate: 44000 },
    { id: 'datacenter',    tag: 'DC', name: 'Data Center',          baseCost: 5100000000, baseRate: 260000 },
    { id: 'agi',           tag: 'AG', name: 'Self-Improving Codegen Cluster', baseCost: 75000000000, baseRate: 1600000 }
  ];

  var FLAVOR_LINES = {
    stackoverflow: ['found the answer on page 4 of search results', 'copy-pasted without reading', 'closed 11 duplicate tabs'],
    intern:        ['asked what a merge conflict is', 'pushed straight to main', 'is very enthusiastic'],
    junior:        ['googled the error message', 'added a console.log and left it in', 'refactored one function, broke three'],
    senior:        ["said 'it depends' in standup", 'reviewed a PR in 90 seconds', 'remembers when it was worse'],
    copilot:       ['autocompleted an entire function', 'suggested code that almost works', 'never sleeps, never complains'],
    contractors:   ['billed by the hour', 'asked for the requirements doc (there isn\u2019t one)', 'shipped fast, documented never'],
    offshore:      ['works while you sleep', 'handoff meeting ran long', 'timezone math is hard'],
    cicd:          ['pipeline went green on the third retry', 'cache invalidated, rebuilding everything', 'deployed to prod on a Friday'],
    datacenter:    ['fans spun up to 100%', 'cooling bill just went up', 'racks hum quietly in the dark'],
    agi:           ['wrote its own unit tests', 'reviewed its own PR', 'asked for read access to prod']
  };

  var AMBIENT_LINES = [
    'a wild merge conflict appears', 'someone force-pushed to main', 'the tests are flaky again',
    'linter found 0 problems (suspicious)', 'coffee machine refilled', 'PR approved after 6 rounds of review',
    'staging is down again', 'it works on my machine', 'sprint planning ran 45 minutes over',
    'someone renamed a variable for "clarity"', 'a rubber duck was consulted', 'the build cache was cleared, for luck'
  ];

  var CLICK_UPGRADE_NAMES = [
    'Better Keyboard', 'Dual Monitors', 'Mechanical Keyboard (Clicky)', 'Vim Motions',
    'Copilot Autocomplete', 'Neural Interface'
  ];

  var STORAGE_KEY = 'commitEngineSave';
  var OFFLINE_CAP_SECONDS = 12 * 3600;
  var TICK_MS = 100;
  var AUTOSAVE_MS = 5000;
  var AMBIENT_MS = 25000;
  var MAX_LOG_ENTRIES = 40;

  var FREE_TRIAL_NAMES = [
    'Enterprise IDE Pro', 'CloudScale Compute', 'PremiumLint AI',
    'TurboBuild CI', 'Quantum Autocomplete', 'DevOps Unlimited'
  ];
  var FREE_TRIAL_MIN_MS = 45000;
  var FREE_TRIAL_MAX_MS = 110000;
  var FREE_TRIAL_VISIBLE_MS = 12000;
  var FREE_TRIAL_WIDTH = 170;
  var FREE_TRIAL_HEIGHT = 80;

  // ---------- Helpers ----------

  function formatNumber(n) {
    if (n === null || n === undefined || isNaN(n)) return '0';
    var sign = n < 0 ? '-' : '';
    n = Math.abs(n);
    if (n < 1000) return sign + (Number.isInteger(n) ? n.toString() : n.toFixed(1));
    var suffixes = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
    var tier = Math.min(Math.floor(Math.log10(n) / 3), suffixes.length - 1);
    var scaled = n / Math.pow(1000, tier);
    var decimals = scaled < 10 ? 2 : (scaled < 100 ? 1 : 0);
    return sign + scaled.toFixed(decimals) + suffixes[tier];
  }

  function bulkCost(baseCost, owned, qty) {
    if (qty <= 0) return 0;
    return baseCost * Math.pow(GROWTH, owned) * (Math.pow(GROWTH, qty) - 1) / (GROWTH - 1);
  }

  function maxAffordable(baseCost, owned, loc) {
    if (loc <= 0) return 0;
    var ratio = 1 + (loc * (GROWTH - 1)) / (baseCost * Math.pow(GROWTH, owned));
    if (ratio <= 0) return 0;
    return Math.max(Math.floor(Math.log(ratio) / Math.log(GROWTH)), 0);
  }

  function clickUpgradeCost(level) {
    return 50 * Math.pow(10, level);
  }

  function clickUpgradeName(level) {
    if (level < CLICK_UPGRADE_NAMES.length) return CLICK_UPGRADE_NAMES[level];
    return 'Overclock Module Mk' + (level - CLICK_UPGRADE_NAMES.length + 1);
  }

  function velocityMultiplier(refactorPoints) {
    return 1 + refactorPoints * 0.01;
  }

  function computeProduction(s) {
    var base = 0;
    for (var i = 0; i < GENERATORS.length; i++) {
      base += (s.generators[i] || 0) * GENERATORS[i].baseRate;
    }
    return base * velocityMultiplier(s.refactorPoints);
  }

  function computeClickPower(s) {
    return Math.pow(2, s.clickLevel) * velocityMultiplier(s.refactorPoints);
  }

  function timeString() {
    return new Date().toLocaleTimeString('en-US', { hour12: false });
  }

  function formatDuration(seconds) {
    var h = Math.floor(seconds / 3600);
    var m = Math.floor((seconds % 3600) / 60);
    if (h > 0) return h + 'h ' + m + 'm';
    if (m > 0) return m + 'm';
    return Math.floor(seconds) + 's';
  }

  function initialState() {
    return {
      loc: 0,
      totalLocEarned: 0,
      allTimeLoc: 0,
      clickLevel: 0,
      generators: GENERATORS.map(function () { return 0; }),
      refactorPoints: 0,
      prestigeCount: 0,
      lastSaveTime: Date.now()
    };
  }

  // ---------- State ----------

  var state = initialState();
  var buyMult = 1;
  var logs = [{ time: timeString(), text: 'terminal initialized. good luck.' }];
  var prestigeArmed = false;
  var prestigeArmTimeout = null;
  var pulseTimeout = null;
  var freeTrialSpawnTimeout = null;
  var freeTrialHideTimeout = null;

  // ---------- Persistence ----------

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  }

  function saveState() {
    try {
      var toSave = Object.assign({}, state, { lastSaveTime: Date.now() });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
    } catch (e) { /* storage unavailable or full — ignore */ }
  }

  // ---------- DOM refs ----------

  var el = {
    versionLabel: document.getElementById('version-label'),
    prestigeBtn: document.getElementById('prestige-btn'),
    prestigeLabel: document.getElementById('prestige-label'),
    prestigeGainLabel: document.getElementById('prestige-gain-label'),
    welcomeBanner: document.getElementById('welcome-banner'),
    welcomeText: document.getElementById('welcome-text'),
    welcomeClose: document.getElementById('welcome-close'),
    statLoc: document.getElementById('stat-loc'),
    statLocps: document.getElementById('stat-locps'),
    statVelocity: document.getElementById('stat-velocity'),
    statRp: document.getElementById('stat-rp'),
    bigLoc: document.getElementById('big-loc'),
    clickBtn: document.getElementById('click-btn'),
    clickPowerLabel: document.getElementById('click-power-label'),
    clickUpgradeBtn: document.getElementById('click-upgrade-btn'),
    clickUpgradeName: document.getElementById('click-upgrade-name'),
    clickUpgradeCost: document.getElementById('click-upgrade-cost'),
    buyMultGroup: document.getElementById('buy-mult-group'),
    shopList: document.getElementById('shop-list'),
    logList: document.getElementById('log-list')
  };

  // ---------- Log ----------

  function pushLog(text) {
    logs.unshift({ time: timeString(), text: text });
    if (logs.length > MAX_LOG_ENTRIES) logs.length = MAX_LOG_ENTRIES;
    renderLog();
  }

  function renderLog() {
    el.logList.innerHTML = logs.map(function (log, i) {
      return '<div class="log-entry" style="' + (i === 0 ? 'color:var(--text);' : '') + '">' +
        '<span class="log-time">[' + log.time + ']</span> ' + escapeHtml(log.text) +
        '</div>';
    }).join('');
  }

  function escapeHtml(str) {
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ---------- Shop rows (built once, updated in place) ----------

  var shopRowEls = [];

  function buildShop() {
    el.shopList.innerHTML = '';
    shopRowEls = GENERATORS.map(function (gen, i) {
      var btn = document.createElement('button');
      btn.className = 'shop-row';
      btn.innerHTML =
        '<div class="shop-row-left">' +
          '<span class="shop-tag">' + gen.tag + '</span>' +
          '<div class="shop-name-block">' +
            '<div class="shop-name">' + escapeHtml(gen.name) + '</div>' +
            '<div class="shop-sub" data-role="sub"></div>' +
          '</div>' +
        '</div>' +
        '<div class="shop-right">' +
          '<div class="shop-cost" data-role="cost"></div>' +
          '<div class="shop-qty" data-role="qty"></div>' +
        '</div>';
      btn.addEventListener('click', function () { buyGenerator(i); });
      el.shopList.appendChild(btn);
      return btn;
    });
  }

  function renderShop() {
    for (var i = 0; i < GENERATORS.length; i++) {
      var gen = GENERATORS[i];
      var owned = state.generators[i];
      var qty = buyMult === 'max' ? maxAffordable(gen.baseCost, owned, state.loc) : buyMult;
      var cost = bulkCost(gen.baseCost, owned, qty || 1);
      var affordable = qty > 0 && cost <= state.loc;
      var row = shopRowEls[i];
      row.disabled = !affordable;
      row.style.opacity = affordable ? '1' : '0.4';
      row.querySelector('[data-role="sub"]').textContent =
        'owned ' + owned + ' \u00b7 ' + formatNumber(gen.baseRate * velocityMultiplier(state.refactorPoints)) + '/s each';
      row.querySelector('[data-role="cost"]').textContent = formatNumber(cost);
      row.querySelector('[data-role="qty"]').textContent = buyMult === 'max' ? ('x' + (qty || 0)) : ('x' + buyMult);
    }
  }

  // ---------- Render (stats + click panel + prestige) ----------

  function render() {
    var production = computeProduction(state);
    var clickPower = computeClickPower(state);
    var velocityPct = (velocityMultiplier(state.refactorPoints) - 1) * 100;
    var potential = Math.floor(Math.sqrt(state.totalLocEarned / 1e6));
    var prestigeGain = Math.max(potential - state.refactorPoints, 0);

    el.statLoc.textContent = formatNumber(state.loc);
    el.statLocps.textContent = formatNumber(production);
    el.statVelocity.textContent = '+' + velocityPct.toFixed(0) + '%';
    el.statRp.textContent = formatNumber(state.refactorPoints);
    el.bigLoc.textContent = formatNumber(state.loc);
    el.clickPowerLabel.textContent = '+' + formatNumber(clickPower) + ' LOC';

    var clickCost = clickUpgradeCost(state.clickLevel);
    el.clickUpgradeName.textContent = clickUpgradeName(state.clickLevel);
    el.clickUpgradeCost.textContent = formatNumber(clickCost);
    el.clickUpgradeBtn.disabled = clickCost > state.loc;

    el.versionLabel.textContent = 'v' + state.prestigeCount + '.' + (state.prestigeCount === 0 ? '0-alpha' : '0');

    el.prestigeBtn.classList.toggle('ready', prestigeGain > 0);
    el.prestigeBtn.classList.toggle('armed', prestigeArmed && prestigeGain > 0);
    el.prestigeBtn.disabled = prestigeGain <= 0;
    el.prestigeLabel.textContent = prestigeArmed ? 'confirm ship?' : ('ship v' + (state.prestigeCount + 1) + '.0');
    el.prestigeGainLabel.textContent = prestigeGain > 0 ? ('+' + prestigeGain + 'RP') : '';
    el.prestigeBtn.title = prestigeGain > 0
      ? ('Ship v' + (state.prestigeCount + 1) + '.0 for +' + prestigeGain + ' Refactor Points')
      : 'Keep writing code to unlock a ship-worthy release';

    renderShop();
  }

  // ---------- Actions ----------

  function handleClick() {
    var power = computeClickPower(state);
    state.loc += power;
    state.totalLocEarned += power;
    state.allTimeLoc += power;
    el.clickBtn.classList.add('pulse');
    if (pulseTimeout) clearTimeout(pulseTimeout);
    pulseTimeout = setTimeout(function () { el.clickBtn.classList.remove('pulse'); }, 100);
    render();
  }

  function buyGenerator(index) {
    var gen = GENERATORS[index];
    var owned = state.generators[index];
    var qty = buyMult === 'max' ? maxAffordable(gen.baseCost, owned, state.loc) : buyMult;
    if (qty <= 0) return;
    var cost = bulkCost(gen.baseCost, owned, qty);
    if (cost > state.loc) return;
    state.loc -= cost;
    state.generators[index] = owned + qty;
    var flavors = FLAVOR_LINES[gen.id];
    var flavor = flavors[Math.floor(Math.random() * flavors.length)];
    pushLog('+' + qty + ' ' + gen.name + (qty > 1 ? 's' : '') + ' (now ' + (owned + qty) + ') \u2014 ' + flavor);
    render();
  }

  function buyClickUpgrade() {
    var cost = clickUpgradeCost(state.clickLevel);
    if (cost > state.loc) return;
    state.loc -= cost;
    var boughtName = clickUpgradeName(state.clickLevel);
    state.clickLevel += 1;
    pushLog('upgraded to ' + boughtName + ' \u2014 write speed doubled');
    render();
  }

  function handlePrestigeClick() {
    var potential = Math.floor(Math.sqrt(state.totalLocEarned / 1e6));
    var prestigeGain = Math.max(potential - state.refactorPoints, 0);
    if (prestigeGain <= 0) return;

    if (!prestigeArmed) {
      prestigeArmed = true;
      if (prestigeArmTimeout) clearTimeout(prestigeArmTimeout);
      prestigeArmTimeout = setTimeout(function () {
        prestigeArmed = false;
        render();
      }, 4000);
      render();
      return;
    }

    prestigeArmed = false;
    if (prestigeArmTimeout) clearTimeout(prestigeArmTimeout);

    var newRP = state.refactorPoints + prestigeGain;
    var newVelPct = (velocityMultiplier(newRP) - 1) * 100;
    var shippedVersion = state.prestigeCount + 1;
    pushLog('SHIPPED v' + shippedVersion + '.0 \u2014 gained ' + prestigeGain + ' Refactor Points. Codebase reset. Velocity now +' + newVelPct.toFixed(0) + '%.');

    state = {
      loc: 0,
      totalLocEarned: 0,
      allTimeLoc: state.allTimeLoc,
      clickLevel: 0,
      generators: GENERATORS.map(function () { return 0; }),
      refactorPoints: newRP,
      prestigeCount: shippedVersion,
      lastSaveTime: Date.now()
    };
    render();
    saveState();
  }

  function setBuyMult(m) {
    buyMult = m === 'max' ? 'max' : parseInt(m, 10);
    var btns = el.buyMultGroup.querySelectorAll('.mult-btn');
    btns.forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-mult') === String(m));
    });
    renderShop();
  }

  // ---------- Free trial popup ----------

  function randomBetween(min, max) {
    return min + Math.random() * (max - min);
  }

  function scheduleFreeTrial() {
    if (freeTrialSpawnTimeout) clearTimeout(freeTrialSpawnTimeout);
    freeTrialSpawnTimeout = setTimeout(showFreeTrial, randomBetween(FREE_TRIAL_MIN_MS, FREE_TRIAL_MAX_MS));
  }

  function showFreeTrial() {
    var wrap = document.querySelector('.wrap');
    var badge = document.getElementById('free-trial');
    var name = FREE_TRIAL_NAMES[Math.floor(Math.random() * FREE_TRIAL_NAMES.length)];

    document.getElementById('free-trial-title').textContent = name.toUpperCase() + ' \u2014 FREE TRIAL';
    document.getElementById('free-trial-sub').textContent = 'claim now \u2014 instant 10x LOC';
    badge.dataset.name = name;

    var maxLeft = Math.max(wrap.clientWidth - FREE_TRIAL_WIDTH - 8, 8);
    var maxTop = Math.max(wrap.scrollHeight - FREE_TRIAL_HEIGHT - 8, 90);
    badge.style.left = randomBetween(8, maxLeft) + 'px';
    badge.style.top = randomBetween(90, maxTop) + 'px';
    badge.style.display = 'block';

    if (freeTrialHideTimeout) clearTimeout(freeTrialHideTimeout);
    freeTrialHideTimeout = setTimeout(function () {
      badge.style.display = 'none';
      pushLog('a ' + name + ' free trial expired, unused');
      scheduleFreeTrial();
    }, FREE_TRIAL_VISIBLE_MS);
  }

  function claimFreeTrial() {
    var badge = document.getElementById('free-trial');
    if (badge.style.display === 'none') return;
    var name = badge.dataset.name || 'Free Trial';
    badge.style.display = 'none';
    if (freeTrialHideTimeout) clearTimeout(freeTrialHideTimeout);

    var gain = Math.max(state.loc * 9, 50);
    state.loc += gain;
    state.totalLocEarned += gain;
    state.allTimeLoc += gain;
    pushLog('FREE TRIAL CLAIMED (' + name + ') \u2014 +' + formatNumber(gain) + ' LOC. auto-renews at full price next month.');
    render();
    scheduleFreeTrial();
  }

  // ---------- Init ----------

  function init() {
    buildShop();

    var loaded = loadState();
    if (loaded) {
      state = Object.assign(initialState(), loaded);
      // make sure generators array length matches config (in case of future updates)
      while (state.generators.length < GENERATORS.length) state.generators.push(0);

      var now = Date.now();
      var elapsedSec = Math.min((now - (state.lastSaveTime || now)) / 1000, OFFLINE_CAP_SECONDS);
      if (elapsedSec > 5) {
        var rate = computeProduction(state);
        var gained = rate * elapsedSec;
        state.loc += gained;
        state.totalLocEarned += gained;
        state.allTimeLoc += gained;
        if (gained > 0.5) {
          el.welcomeText.textContent = 'while you were grinding Claude Code, your team shipped ' +
            formatNumber(gained) + ' LOC over ' + formatDuration(elapsedSec) + '.';
          el.welcomeBanner.style.display = 'flex';
        }
      }
    }

    render();
    renderLog();

    el.clickBtn.addEventListener('click', handleClick);
    el.clickUpgradeBtn.addEventListener('click', buyClickUpgrade);
    el.prestigeBtn.addEventListener('click', handlePrestigeClick);
    el.welcomeClose.addEventListener('click', function () { el.welcomeBanner.style.display = 'none'; });
    el.buyMultGroup.querySelectorAll('.mult-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { setBuyMult(btn.getAttribute('data-mult')); });
    });
    document.getElementById('free-trial').addEventListener('click', claimFreeTrial);
    scheduleFreeTrial();

    // Game tick
    setInterval(function () {
      var gain = computeProduction(state) * (TICK_MS / 1000);
      if (gain > 0) {
        state.loc += gain;
        state.totalLocEarned += gain;
        state.allTimeLoc += gain;
      }
      render();
    }, TICK_MS);

    // Autosave
    setInterval(saveState, AUTOSAVE_MS);
    window.addEventListener('beforeunload', saveState);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') saveState();
    });

    // Ambient log lines
    setInterval(function () {
      var hasProgress = state.generators.some(function (n) { return n > 0; });
      if (hasProgress && Math.random() < 0.8) {
        pushLog(AMBIENT_LINES[Math.floor(Math.random() * AMBIENT_LINES.length)]);
      }
    }, AMBIENT_MS);
  }

  init();
})();
</script>
